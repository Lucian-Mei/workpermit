user  nginx;
worker_processes  2;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    upstream ehs_frontend {
        server frontend:80;
    }
    upstream ehs_backend {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://ehs_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://ehs_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 上传的文件（隐患照片、证书等），代理到后端静态目录
        location /uploads/ {
            proxy_pass http://ehs_backend;
            proxy_set_header Host $host;
        }

        # 备份文件下载
        location /backups/ {
            proxy_pass http://ehs_backend;
            proxy_set_header Host $host;
        }
    }

    # 有证书后启用（把 certs 里的文件放好，删除上面 80 的 server 或保留皆可）
    # server {
    #     listen 443 ssl;
    #     server_name 你的域名;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     location / { proxy_pass http://ehs_frontend; }
    #     location /api/ { proxy_pass http://ehs_backend/; }
    #     location /uploads/ { proxy_pass http://ehs_backend; }
    #     location /backups/ { proxy_pass http://ehs_backend; }
    # }
}
