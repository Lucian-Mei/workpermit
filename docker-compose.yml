# EHS 管理系统 —— 适用于阿里云 2 核 4G 轻量服务器
# 启动：docker compose up -d
# 数据库持久化在名为 ehs_pg_data 的卷里，升级不会丢数据

services:
  postgres:
    image: postgres:16-alpine
    container_name: ehs_postgres
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${DB_USER:-ehs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ehs_secure_2026}
      POSTGRES_DB: ${DB_NAME:-ehs}
    volumes:
      - ehs_pg_data:/var/lib/postgresql/data
    ports:
      # 仅本机访问，不对外暴露；如要远程调试可临时开放
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ehs} -d ${DB_NAME:-ehs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 800m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ehs_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-ehs}:${DB_PASSWORD:-ehs_secure_2026}@postgres:5432/${DB_NAME:-ehs}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      # 管理员初始密码（首次登录需修改）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      # 文件上传根目录（容器内）
      UPLOAD_DIR: /app/uploads
      # 系统对外访问地址：所有二维码 / 邮件审批链接 / 分享链接的根地址。
      # 必须填服务器实际可访问的地址（含端口），否则手机扫码会指向 localhost 打不开。
      # 阿里云部署示例：APP_BASE_URL=http://47.100.60.182:8010
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8010}
      # 兼容旧变量名（未设 APP_BASE_URL 时回退）
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # AI 配置（默认 DeepSeek，可改）
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE: ${AI_API_BASE:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # OCR 配置（阿里云）
      OCR_PROVIDER: ${OCR_PROVIDER:-aliyun}
      ALIYUN_OCR_ACCESS_KEY_ID: ${ALIYUN_OCR_ACCESS_KEY_ID:-}
      ALIYUN_OCR_ACCESS_KEY_SECRET: ${ALIYUN_OCR_ACCESS_KEY_SECRET:-}
      ALIYUN_OCR_REGION: ${ALIYUN_OCR_REGION:-cn-shanghai}
      # 飞书多维表格备份（可选，留空则只提供下载备份）
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BITABLE_APP_TOKEN: ${FEISHU_BITABLE_APP_TOKEN:-}
      FEISHU_BITABLE_TABLE_ID: ${FEISHU_BITABLE_TABLE_ID:-}
      BACKUP_CRON_ENABLED: ${BACKUP_CRON_ENABLED:-false}
    volumes:
      - ehs_uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 700m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ehs_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    deploy:
      resources:
        limits:
          memory: 120m

  nginx:
    image: nginx:1.27-alpine
    container_name: ehs_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "8010:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 80m

volumes:
  ehs_pg_data:
  ehs_uploads:
