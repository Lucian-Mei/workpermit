server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html 每次重新校验（no-cache）：入口文件引用带 hash 的构建资源，
    # 若浏览器缓存旧 index.html，部署新版后会请求已删除的旧 chunk → 404 → 页面"加载失败/渲染出错"。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退：前端用 react-router，刷新子路由时回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 构建文件名带内容 hash，内容变化 hash 必变，immutable 安全）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
